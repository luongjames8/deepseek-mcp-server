# DeepSeek CLI configuration
#
# Per-subcommand defaults. Every value is overridable per-call via flags
# (--model, --max-tokens, --thinking, --reasoning-effort).
#
# Legacy aliases (deepseek-chat, deepseek-reasoner) deprecated 2026-07-24.

model:
  allowed:
    - "deepseek-v4-pro"
    - "deepseek-v4-flash"
    - "deepseek-chat"
    - "deepseek-reasoner"

# `deepseek chat` — single-turn chat, no tools.
# Default to Pro: explicit "ask deepseek" → want the better brain.
chat:
  default_model: "deepseek-v4-pro"

# `deepseek search` — Brave search + DeepSeek synthesis.
# Default to Flash: high call volume, summarization is cheap work.
web_search:
  default_model: "deepseek-v4-flash"
  max_results: 10
  max_response_tokens: 8192

# `deepseek fetch` — fetch URL + extract with DeepSeek.
# Default to Flash: extraction from already-fetched content is cheap work.
web_fetch:
  default_model: "deepseek-v4-flash"
  timeout_seconds: 15
  max_content_chars: 50000
  min_content_chars: 500
  max_response_tokens: 8192
